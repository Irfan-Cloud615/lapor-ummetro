server {
    # Nginx mendengarkan permintaan di port 80
    listen 80;
    index index.php index.html;
    server_name _;

    # Mengarahkan pengunjung langsung ke folder public Laravel
    root /var/www/html/public;

    # Mengaktifkan sistem routing bawaan Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Menjembatani file PHP ke kontainer PHP-FPM (bernama 'app')
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # 'app' merujuk pada nama service di docker-compose.yml
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
}
